[project]
name = "lab1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nanashamas", email = "104678426+Nanashamas@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mlflow>=3.16.1",
    "pillow>=12.3.0",
    "scikit-learn>=1.7.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

[project.scripts]
lab1 = "lab1:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
